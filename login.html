<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard de Pedidos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">Painel de Pedidos</h1>
            <p class="login-subtitle">Faça login para acessar o sistema</p>

            <form id="login-form" class="order-form" style="margin-top: 2rem;">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group" style="margin-top: 1rem;">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="Sua senha">
                </div>

                <div id="auth-error" class="error-message hidden" style="margin-top: 1rem; font-size: 0.875rem;"></div>
                <div id="auth-success" class="success-message hidden" style="margin-top: 1rem; font-size: 0.875rem;"></div>

                <div class="form-actions" style="justify-content: space-between; margin-top: 2rem; flex-direction: column; gap: 1rem;">
                    <button type="submit" id="btn-login" class="btn-primary" style="width: 100%;">Entrar</button>
                    <button type="button" id="btn-register" class="btn-secondary" style="width: 100%;">Criar conta</button>
                </div>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
